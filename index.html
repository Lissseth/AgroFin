<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta http-equiv="refresh" content="0; url=/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AgroFin | Redirigiendo</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ecf6ee, #f7f5ef);
      color: #17352e;
    }
    .box {
      text-align: center;
      padding: 32px 24px;
      border-radius: 18px;
      background: rgba(255,255,255,0.8);
      border: 1px solid rgba(18,63,56,0.10);
      box-shadow: 0 20px 40px rgba(18,63,56,0.08);
    }
    a {
      color: #1d6d4d;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="box">
    <p>Redirigiendo al prototipo de AgroFin...</p>
    <p><a href="/">Entrar al panel</a></p>
  </div>
</body>
</html>
