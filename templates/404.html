<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página no encontrada | AgroFin</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #ecf6ee, #f7f5ef);
      color: #17352e;
    }
    .error-container {
      text-align: center;
      padding: 40px;
      max-width: 500px;
    }
    h1 {
      font-size: 120px;
      margin: 0;
      color: #287a50;
      line-height: 1;
    }
    h2 {
      font-size: 24px;
      margin: 20px 0 10px;
      color: #17352e;
    }
    p {
      color: #64756d;
      margin: 10px 0 30px;
    }
    a {
      display: inline-block;
      padding: 12px 24px;
      background: linear-gradient(120deg, #17684b, #16835d);
      color: white;
      text-decoration: none;
      border-radius: 14px;
      font-weight: 700;
      transition: 0.2s;
    }
    a:hover {
      transform: translateY(-2px);
      filter: brightness(1.06);
    }
  </style>
</head>
<body>
  <div class="error-container">
    <h1>404</h1>
    <h2>Página no encontrada</h2>
    <p>Lo sentimos, la página que buscas no existe o ha sido movida.</p>
    <a href="/">Volver a AgroFin</a>
  </div>
</body>
</html>
