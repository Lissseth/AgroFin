services:
  - type: web
    name: agrofin-web
    runtime: docker
    plan: free
    branch: main
    autoDeployTrigger: commit
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: FORCE_HTTPS
        value: "1"
      - key: PORT
        value: "10000"
      - key: PUBLIC_URL
        value: "https://agrofin-web.onrender.com"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: "https://agrofin-web.onrender.com/auth/google/callback"
      - key: DEFAULT_COUNTRY
        value: "Nicaragua"
      - key: DEFAULT_TIMEZONE
        value: "America/Managua"